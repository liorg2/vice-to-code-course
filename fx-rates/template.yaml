AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Forex Rates API. Every resource is tagged project=fx so teardown can find it.

Parameters:
  AlarmEmail:
    Type: String
    Description: Address that receives alarm mail. Not stored in git; pass it at deploy time.
    Default: replace-me@example.com

Globals:
  Function:
    Runtime: nodejs22.x
    MemorySize: 256
    Timeout: 8
    Tracing: PassThrough
    Tags:
      project: fx

Resources:
  RatesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true
      Tags:
        - Key: project
          Value: fx

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: staging
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 5
      Tags:
        project: fx

  RequestFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/lambda.handler
      CodeUri: .
      Description: Reads cached rates. Read-only on the rates table.
      Environment:
        Variables:
          TABLE_NAME: !Ref RatesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref RatesTable
      Events:
        Proxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        Health:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /v1/health
            Method: GET
      Tags:
        project: fx

  RefreshFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: dist/refresh.handler
      CodeUri: .
      Timeout: 20
      Description: Writes fresh rates. Read and write on this table only.
      Environment:
        Variables:
          TABLE_NAME: !Ref RatesTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RatesTable
      Events:
        Hourly:
          Type: Schedule
          Properties:
            Schedule: rate(1 hour)
            Name: fx-refresh
            Description: Refresh cached rates
      Tags:
        project: fx

  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      Tags:
        - Key: project
          Value: fx

  AlarmSubscription:
    Type: AWS::SNS::Subscription
    Properties:
      TopicArn: !Ref AlarmTopic
      Protocol: email
      Endpoint: !Ref AlarmEmail

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: HTTP API 5xx
      Namespace: AWS/ApiGateway
      MetricName: 5xx
      Dimensions:
        - Name: ApiId
          Value: !Ref HttpApi
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
      Tags:
        - Key: project
          Value: fx

  RefreshErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Refresh function errors
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref RefreshFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      AlarmActions:
        - !Ref AlarmTopic
      Tags:
        - Key: project
          Value: fx

  RequestLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${RequestFunction}"
      RetentionInDays: 14
      Tags:
        - Key: project
          Value: fx

Outputs:
  StagingUrl:
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/staging"
  Teardown:
    Value: sam delete --stack-name fx-rates-staging --region us-east-1
